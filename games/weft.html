<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weft</title>
<link rel="icon" href="../img/favicon.png">
<link href="../vendor/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --oak:#6B4E2C; --linen:#E8DCC0; --madder:#B5483C; --woad:#3F6491;
    --gold:#D9A342; --cream:#F3EADA;
    --font:"EB Garamond",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--font); color:var(--cream);
    background:radial-gradient(76% 44% at 50% 14%, #4A3A24 0%, rgba(74,58,36,0) 70%), #1E1710;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:16px 12px; min-height:100%; -webkit-tap-highlight-color:transparent;
  }
  .frame{
    position:relative; aspect-ratio:5/8; width:min(94vw,54vh,470px); height:auto;
    border-radius:calc(var(--u,1)*10px); overflow:hidden;
    border:1px solid rgba(217,163,66,.26);
    box-shadow:0 28px 66px -20px #000;
    touch-action:manipulation; cursor:pointer;
  }
  canvas{display:block; width:100%; height:100%}
  .panel{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:calc(var(--u)*12px);
    text-align:center; padding:calc(var(--u)*30px);
    background:linear-gradient(180deg, rgba(30,23,16,.46), rgba(30,23,16,.86));
  }
  .panel[hidden]{display:none}
  h1{
    margin:0; font-size:calc(var(--u)*56px); font-weight:600; line-height:.92;
    color:var(--cream); text-shadow:0 calc(var(--u)*3px) calc(var(--u)*20px) rgba(0,0,0,.8);
  }
  .rule{width:calc(var(--u)*118px); height:1px; background:var(--gold); opacity:.55; position:relative}
  .rule::after{
    content:"⧗"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:#2A2015; color:var(--gold); font-size:calc(var(--u)*13px); padding:0 calc(var(--u)*8px);
  }
  .lede{margin:0; max-width:25ch; font-size:calc(var(--u)*19px); font-style:italic;
        color:#D6C9AF; line-height:1.5}
  .tally{display:flex; gap:calc(var(--u)*30px)}
  .tally div{display:flex; flex-direction:column; gap:calc(var(--u)*3px)}
  .tally b{font-size:calc(var(--u)*44px); font-weight:600; color:var(--gold); line-height:.9}
  .tally i{font-style:italic; font-size:calc(var(--u)*14px); color:#AB9E82}
  button{
    font-family:var(--font); font-size:calc(var(--u)*21px); font-weight:600;
    color:#241A06; background:linear-gradient(180deg,#F0C878,#D9A342); border:0; cursor:pointer;
    padding:calc(var(--u)*11px) calc(var(--u)*32px); border-radius:calc(var(--u)*3px);
    box-shadow:0 calc(var(--u)*4px) 0 #8F6520;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover{transform:translateY(calc(var(--u)*-2px)); box-shadow:0 calc(var(--u)*6px) 0 #8F6520}
  button:active{transform:translateY(calc(var(--u)*3px)); box-shadow:0 calc(var(--u)*1px) 0 #8F6520}
  :focus-visible{outline:2px solid var(--cream); outline-offset:4px}
  .sound{
    position:absolute; top:calc(var(--u)*12px); right:calc(var(--u)*12px);
    width:calc(var(--u)*34px); height:calc(var(--u)*34px); padding:0; border-radius:50%;
    background:rgba(243,234,218,.13); color:var(--cream); box-shadow:none;
    font-size:calc(var(--u)*15px); line-height:1; display:grid; place-items:center;
  }
  .sound:hover{background:rgba(243,234,218,.24); transform:none; box-shadow:none}
  .keys{margin:0; font-size:13px; font-style:italic; color:#73695A}
  .keys kbd{font-family:inherit; font-style:normal; color:#B5A98E;
    background:rgba(255,255,255,.06); border-radius:4px; padding:1px 7px}
  @media (prefers-reduced-motion:reduce){ button{transition:none} }
</style>
</head>
<body>
  <div class="frame" id="frame">
    <canvas id="game"></canvas>
    <div class="panel" id="readyPanel">
      <h1>Weft</h1>
      <div class="rule"></div>
      <p class="lede">Throw the shuttle through the shed. Every row you weave stays on the cloth.</p>
      <button id="startBtn" type="button">Begin the cloth</button>
    </div>
    <div class="panel" id="overPanel" hidden>
      <h1 id="verdict">The cloth frayed</h1>
      <div class="rule"></div>
      <div class="tally">
        <div><b id="finalScore">0</b><i>rows</i></div>
        <div><b id="finalGold">0</b><i>gold thread</i></div>
        <div><b id="bestScore">0</b><i>best</i></div>
      </div>
      <button id="againBtn" type="button">New cloth</button>
    </div>
    <button class="sound" id="soundBtn" type="button" aria-label="Mute sound">♪</button>
  </div>
  <p class="keys"><kbd>space</kbd> throws the shuttle &nbsp;·&nbsp; tap works too</p>

      e.preventDefault(); input();
    }
  });
  document.getElementById('startBtn').addEventListener('click', e => { e.stopPropagation(); start(); });
  document.getElementById('againBtn').addEventListener('click', e => { e.stopPropagation(); start(); });

  function burst(x, y) {
    const a = Math.random() * 6.28, sp = 40 + Math.random() * 120;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
                  rot: a, vr: (Math.random() - .5) * 8, life: 0, max: 0.5,
                  size: 9 + Math.random() * 10 });
  }

  /* ------------------------------------------------------------ logic */
  function step(dt) {
    t += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 32);
    if (flashT > 0) flashT = Math.max(0, flashT - dt * 2.4);
    if (judgeT > 0) judgeT = Math.max(0, judgeT - dt);
    if (throwT > 0) throwT = Math.max(0, throwT - dt);

    if (state === 'weave') {
      sh.x += sh.dir * speedOf(score) * dt;
      if (sh.x > X1) { sh.x = X1; sh.dir = -1; }
      if (sh.x < X0) { sh.x = X0; sh.dir = 1; }
    }
    for (const r of rows) r.age += dt;
    for (const s of sparks) {
      s.life += dt; s.vy += 110 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
    }
    sparks = sparks.filter(s => s.life < s.max);
  }

  /* ------------------------------------------------------------- draw */
  function drawCloth() {
    const n = rows.length;
    for (let i = 0; i < n; i++) {
      const r = rows[n - 1 - i];
      const y = RAIL - 40 - i * ROW_H;
      if (y < CLOTH_TOP - ROW_H) break;
      const base = r.kind === 'fray' ? '#7A6A55' : r.kind === 'gold' ? '#C08F2E' : '#B9A583';
      const alt  = r.kind === 'fray' ? '#5E5140' : r.kind === 'gold' ? '#E8C066' : '#D8C6A6';
      for (let x = X0; x < X1; x += 12) {
        ctx.fillStyle = ((x / 12) | 0) % 2 ? base : alt;
        ctx.fillRect(x, y, 11, ROW_H - 1.5);
      }
      // the knot marks where the shuttle actually stopped
      ctx.fillStyle = r.kind === 'gold' ? '#FFE9AE' : r.kind === 'fray' ? '#9C3A30' : '#8A7454';
      ctx.fillRect(r.x - 7, y, 14, ROW_H - 1.5);
      if (r.kind === 'fray') {
        ctx.strokeStyle = 'rgba(156,58,48,.75)'; ctx.lineWidth = 1.2;
        for (let k = 0; k < 5; k++) {
          const fx = r.x - 12 + k * 6;
          ctx.beginPath(); ctx.moveTo(fx, y + ROW_H); ctx.lineTo(fx + (k % 2 ? 4 : -4), y + ROW_H + 7);
          ctx.stroke();
        }
      }
    }
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2A2015'); g.addColorStop(0.6, '#39291A'); g.addColorStop(1, '#241A11');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // loom frame and warp threads
    ctx.fillStyle = '#5A4128'; ctx.fillRect(X0 - 20, 60, 14, RAIL - 40);
    ctx.fillRect(X1 + 6, 60, 14, RAIL - 40);
    ctx.fillStyle = '#6B4E2C'; ctx.fillRect(X0 - 26, 52, (X1 - X0) + 52, 14);
    ctx.strokeStyle = 'rgba(232,220,192,.16)'; ctx.lineWidth = 1;
    for (let x = X0 + 4; x < X1; x += 9) {
      ctx.beginPath(); ctx.moveTo(x, 66); ctx.lineTo(x, RAIL - 30); ctx.stroke();
    }

    drawCloth();

    // the rail, and the shed you are aiming for
    ctx.fillStyle = '#4A3520'; ctx.fillRect(X0 - 10, RAIL - 6, (X1 - X0) + 20, 16);
    ctx.fillStyle = '#5E4428'; ctx.fillRect(X0 - 10, RAIL - 6, (X1 - X0) + 20, 4);
    if (state === 'weave') {
      ctx.fillStyle = 'rgba(217,163,66,.28)';
      ctx.fillRect(band.x, RAIL - 30, band.w, 26);
      ctx.fillStyle = 'rgba(255,233,174,.5)';
      ctx.fillRect(band.x + band.w / 2 - band.core / 2, RAIL - 30, band.core, 26);
      ctx.strokeStyle = 'rgba(232,184,92,.85)'; ctx.lineWidth = 1.6;
      ctx.strokeRect(band.x, RAIL - 30, band.w, 26);
    }

    // the shuttle itself
    if (state === 'weave' || state === 'over') {
      const x = sh.x, y = RAIL - 14;
      ctx.save(); ctx.translate(x, y);
      ctx.fillStyle = '#8A5A2B';
      ctx.beginPath();
      ctx.moveTo(-17, 0); ctx.quadraticCurveTo(0, -9, 17, 0);
      ctx.quadraticCurveTo(0, 9, -17, 0); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#3A250F'; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = '#E8DCC0'; ctx.fillRect(-6, -3, 12, 6);
      ctx.restore();
    }

    // the weaver
    const cw = 52, ch = cw * 100 / 132;
    ctx.save();
    ctx.translate(58, H - 30);
    if (state === 'over') ctx.rotate(-0.35);
    ctx.scale(-1, 1);
    ctx.drawImage(state === 'over' ? img.fall : (throwT > 0.06 ? img.b : img.a), -cw / 2, -ch, cw, ch);
    ctx.restore();

    for (const s of sparks) {
      const k = 1 - s.life / s.max;
      ctx.save(); ctx.globalAlpha = Math.min(1, k * 1.7);
      ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.drawImage(img.spark, -s.size / 2, -s.size / 2, s.size, s.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (state !== 'ready') {
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '600 44px "EB Garamond",Georgia,serif';
      ctx.fillStyle = 'rgba(243,234,218,.95)';
      ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 14;
      ctx.fillText(score, W / 2, 34);
      if (judgeT > 0) {
        ctx.globalAlpha = Math.min(1, judgeT * 3);
        ctx.font = 'italic 600 19px "EB Garamond",Georgia,serif';
        ctx.fillStyle = judge === 'gold thread' ? '#FFE9AE' : judge === 'woven' ? '#D8C6A6' : '#D8756A';
        ctx.fillText(judge, W / 2, RAIL + 34);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      // frays remaining
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < 3 - frays ? '#D9A342' : 'rgba(217,163,66,.22)';
        ctx.beginPath(); ctx.arc(W - 26 - i * 17, 34, 5.5, 0, 6.2832); ctx.fill();
      }
    }
    ctx.restore();

    if (flashT > 0) {
      ctx.fillStyle = `rgba(255,233,174,${flashT * 0.12})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* -------------------------------------------------------- main loop */
  function resize() {
    const r = frame.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    document.documentElement.style.setProperty('--u', (r.width / W).toFixed(4));
  }
  addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(frame);

  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt;
    while (acc > 1 / 120) { step(1 / 120); acc -= 1 / 120; }
    render();
    requestAnimationFrame(loop);
  }

  if (window.__WF_TEST)                       // read-only hook for the test harness
    window.__wf = () => ({ state, sh, band, score, gold, frays, streak,
                           speed: speedOf(score), window: windowOf(score) });

  Promise.all(pending).then(() => {
    resize();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
