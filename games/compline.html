<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compline</title>
<link rel="icon" href="../img/favicon.png">
<link href="../vendor/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --dark:#191510; --candle:#F0C878; --moth:#F6EFD8; --gold:#E8B85C;
    --cream:#EDE3CC; --font:"EB Garamond",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--font); color:var(--cream);
    background:radial-gradient(70% 45% at 50% 16%, #2E2418 0%, rgba(46,36,24,0) 70%), #0C0A07;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:16px 12px; min-height:100%; -webkit-tap-highlight-color:transparent;
  }
  .frame{
    position:relative; aspect-ratio:5/8; width:min(94vw,54vh,470px); height:auto;
    border-radius:calc(var(--u,1)*10px); overflow:hidden;
    border:1px solid rgba(240,200,120,.22);
    box-shadow:0 28px 66px -20px #000;
    touch-action:manipulation; cursor:pointer;
  }
  canvas{display:block; width:100%; height:100%}
  .panel{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:calc(var(--u)*12px);
    text-align:center; padding:calc(var(--u)*30px);
    background:linear-gradient(180deg, rgba(12,10,7,.42), rgba(12,10,7,.84));
  }
  .panel[hidden]{display:none}
  h1{
    margin:0; font-size:calc(var(--u)*50px); font-weight:600; line-height:.92;
    color:var(--cream); text-shadow:0 calc(var(--u)*3px) calc(var(--u)*22px) rgba(0,0,0,.8);
  }
  .rule{width:calc(var(--u)*118px); height:1px; background:var(--candle); opacity:.5; position:relative}
  .rule::after{
    content:"✦"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:#1C170F; color:var(--candle); font-size:calc(var(--u)*12px); padding:0 calc(var(--u)*8px);
  }
  .lede{margin:0; max-width:25ch; font-size:calc(var(--u)*19px); font-style:italic;
        color:#CFC3A6; line-height:1.5}
  .legend{display:flex; gap:calc(var(--u)*26px); align-items:center; font-size:calc(var(--u)*15px);
          color:#BEB198; font-style:italic}
  .legend b{display:block; font-style:normal; font-size:calc(var(--u)*13px); letter-spacing:.02em}
  .tally{display:flex; gap:calc(var(--u)*30px)}
  .tally div{display:flex; flex-direction:column; gap:calc(var(--u)*3px)}
  .tally b{font-size:calc(var(--u)*42px); font-weight:600; color:var(--gold); line-height:.9}
  .tally i{font-style:italic; font-size:calc(var(--u)*14px); color:#A99C82}
  button{
    font-family:var(--font); font-size:calc(var(--u)*21px); font-weight:600;
    color:#1C1405; background:linear-gradient(180deg,#F0C878,#D9A342); border:0; cursor:pointer;
    padding:calc(var(--u)*11px) calc(var(--u)*32px); border-radius:calc(var(--u)*3px);
    box-shadow:0 calc(var(--u)*4px) 0 #8F6520;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover{transform:translateY(calc(var(--u)*-2px)); box-shadow:0 calc(var(--u)*6px) 0 #8F6520}
  button:active{transform:translateY(calc(var(--u)*3px)); box-shadow:0 calc(var(--u)*1px) 0 #8F6520}
  :focus-visible{outline:2px solid var(--cream); outline-offset:4px}
  .sound{
    position:absolute; top:calc(var(--u)*12px); right:calc(var(--u)*12px);
    width:calc(var(--u)*34px); height:calc(var(--u)*34px); padding:0; border-radius:50%;
    background:rgba(237,227,204,.12); color:var(--cream); box-shadow:none;
    font-size:calc(var(--u)*15px); line-height:1; display:grid; place-items:center;
  }
  .sound:hover{background:rgba(237,227,204,.22); transform:none; box-shadow:none}
  .keys{margin:0; font-size:13px; font-style:italic; color:#6B6152}
  .keys kbd{font-family:inherit; font-style:normal; color:#A99C82;
    background:rgba(255,255,255,.06); border-radius:4px; padding:1px 7px}
  @media (prefers-reduced-motion:reduce){ button{transition:none} }
  .keys a{color:inherit; text-underline-offset:3px}
  .keys a:hover{color:var(--cream, #F4ECDA)}
</style>
</head>
<body>
  <div class="frame" id="frame">
    <canvas id="game"></canvas>
    <div class="panel" id="readyPanel">
      <h1>Compline</h1>
      <div class="rule"></div>
      <p class="lede">Strike the moment the moth settles. Leave the beetle alone.</p>
      <button id="startBtn" type="button">Begin the watch</button>
    </div>
    <div class="panel" id="overPanel" hidden>
      <h1 id="verdict">Too soon</h1>
      <div class="rule"></div>
      <p class="lede" id="detail">You moved before it landed.</p>
      <div class="tally">
        <div><b id="finalScore">0</b><i>rounds</i></div>
        <div><b id="finalFast">—</b><i>fastest</i></div>
        <div><b id="bestScore">0</b><i>best</i></div>
      </div>
      <button id="againBtn" type="button">Watch again</button>
    </div>
    <button class="sound" id="soundBtn" type="button" aria-label="Mute sound">♪</button>
  </div>
  <p class="keys"><kbd>space</kbd> to strike &nbsp;·&nbsp; tap works too &nbsp;·&nbsp; <a href="../index.html">all games</a></p>

    else strike();
  }
  frame.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault(); input();
  });
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      if (document.activeElement && /^(BUTTON|A)$/.test(document.activeElement.tagName) && e.code === 'Enter') return;
      e.preventDefault(); input();
    }
  });
  document.getElementById('startBtn').addEventListener('click', e => { e.stopPropagation(); start(); });
  document.getElementById('againBtn').addEventListener('click', e => { e.stopPropagation(); start(); });

  function burst(x, y) {
    const a = Math.random() * 6.28, sp = 40 + Math.random() * 120;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
                  rot: a, vr: (Math.random() - .5) * 7, life: 0, max: 0.55,
                  size: 10 + Math.random() * 11 });
  }

  /* ------------------------------------------------------------ logic */
  function step(dt) {
    t += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 32);
    if (flashT > 0) flashT = Math.max(0, flashT - dt * 2.4);
    if (cat.pounce > 0) { cat.pounce += dt / 0.34; if (cat.pounce >= 1) cat.pounce = 0; }
    cat.twitch += dt * (state === 'wait' ? 3.4 : 1.2);

    if (state === 'wait') {
      waitT -= dt;
      if (waitT <= 0) settleTarget();
    } else if (state === 'signal') {
      if (shownAt) elapse += dt;
      if (target.r < 1) target.r = Math.min(1, target.r + dt * 6);
      if (shownAt && target.kind === 'moth' && elapse * 1000 > limitOf(round))
        lose('Gone', 'The moth was away before you moved.');
      else if (shownAt && target.kind === 'beetle' && elapse > 1.05)
        win('left it');
    } else if (state === 'result') {
      resultT -= dt;
      if (resultT <= 0) nextRound();
    }

    for (const m of moths) {
      m.x += Math.cos(t * m.s + m.p) * 26 * dt;
      m.y += Math.sin(t * m.s * 1.7 + m.p) * 20 * dt;
    }
    for (const s of sparks) {
      s.life += dt; s.vy += 110 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
    }
    sparks = sparks.filter(s => s.life < s.max);
  }

  /* ------------------------------------------------------------- draw */
  function drawCat() {
    const w = 62, h = w * 100 / 132;
    let x = cat.x, y = cat.y, rot = 0, sq = 1;
    if (cat.pounce > 0 && target) {
      const k = Math.sin(Math.min(1, cat.pounce) * Math.PI);
      x += (target.x - cat.x) * k * 0.82;
      y += (target.y - cat.y) * k * 0.82;
      rot = -0.5 * k; sq = 1 + 0.12 * k;
    } else if (state === 'wait' || state === 'signal') {
      sq = 0.94;                                   // crouched, ready
    }
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sq, 2 - sq);
    ctx.drawImage(img.a, -w / 2, -h, w, h);
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#221B12'); g.addColorStop(0.6, '#171209'); g.addColorStop(1, '#0E0B07');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    // shelves receding into the dark
    ctx.fillStyle = '#1F1810';
    for (let r = 0; r < 4; r++) {
      const y = 96 + r * 118;
      ctx.fillRect(0, y, W, 10);
      let x = 6;
      let s = 7 + r;
      while (x < W - 10) {
        const bw = 9 + ((s = (s * 48271) % 2147483647) / 2147483647) * 14;
        const bh = 34 + ((s = (s * 48271) % 2147483647) / 2147483647) * 26;
        ctx.fillStyle = `rgba(${40 + (s % 20)},${32 + (s % 14)},${22 + (s % 10)},1)`;
        ctx.fillRect(x, y - bh, bw - 2, bh);
        x += bw;
      }
      ctx.fillStyle = '#1F1810';
    }

    // candle on the sill
    const flick = 0.85 + 0.15 * Math.sin(t * 12);
    const cg = ctx.createRadialGradient(46, 476, 6, 46, 476, 230 * flick);
    cg.addColorStop(0, 'rgba(240,200,120,.26)'); cg.addColorStop(1, 'rgba(240,200,120,0)');
    ctx.fillStyle = cg; ctx.fillRect(0, 240, W, H - 240);
    ctx.fillStyle = '#E8DCC0'; ctx.fillRect(38, 490, 16, 52);
    ctx.fillStyle = `rgba(255,214,140,${flick})`;
    ctx.beginPath(); ctx.ellipse(46, 478, 7, 13 * flick, 0, 0, 6.2832); ctx.fill();

    // idle moths drifting, never the target
    ctx.globalAlpha = 0.18;
    for (const m of moths) ctx.drawImage(img.moth, m.x - 22, m.y - 22, 44, 44);
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#120E09'; ctx.fillRect(0, 548, W, H - 548);
    ctx.fillStyle = '#2A2115'; ctx.fillRect(0, 548, W, 7);

    drawCat();

    if ((state === 'signal' || (state === 'result' && resultKind === 'left it')) && target) {
      const s = sizeOf(round) * (0.6 + 0.4 * target.r);
      ctx.drawImage(target.kind === 'moth' ? img.moth : img.beetle,
                    target.x - s / 2, target.y - s / 2, s, s);
    }

    for (const s of sparks) {
      const k = 1 - s.life / s.max;
      ctx.save(); ctx.globalAlpha = Math.min(1, k * 1.7);
      ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.drawImage(img.spark, -s.size / 2, -s.size / 2, s.size, s.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (state !== 'ready') {
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '600 46px "EB Garamond",Georgia,serif';
      ctx.fillStyle = 'rgba(237,227,204,.95)';
      ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 14;
      ctx.fillText(score, W / 2, 46);
      ctx.font = 'italic 500 17px "EB Garamond",Georgia,serif';
      ctx.fillStyle = '#B9AC8B';
      if (state === 'wait') ctx.fillText('wait…', W / 2, 84);
      else if (state === 'result' && resultKind === 'caught') ctx.fillText(lastRT + ' ms', W / 2, 84);
      else if (state === 'result') ctx.fillText('left it be', W / 2, 84);
      else if (state === 'signal') ctx.fillText('now', W / 2, 84);
      ctx.restore();
      ctx.save();
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.font = 'italic 500 15px "EB Garamond",Georgia,serif';
      ctx.fillStyle = '#8E836C';
      ctx.fillText(fastest ? 'best ' + fastest + 'ms' : '', W - 56, 30);
      ctx.restore();
    }
    ctx.restore();

    if (flashT > 0) {
      ctx.fillStyle = `rgba(246,239,216,${flashT * 0.10})`;
      ctx.fillRect(0, 0, W, H);
    }

    // stamp the moment the target actually became visible, not when state changed
    if (state === 'signal' && !shownAt) shownAt = performance.now();
  }

  /* -------------------------------------------------------- main loop */
  function resize() {
    const r = frame.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    document.documentElement.style.setProperty('--u', (r.width / W).toFixed(4));
  }
  addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(frame);

  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt;
    while (acc > 1 / 120) { step(1 / 120); acc -= 1 / 120; }
    render();
    requestAnimationFrame(loop);
  }

  if (window.__VG_TEST)                       // read-only hook for the test harness
    window.__vg = () => ({ state, round, score, target, shownAt, elapse, lastRT, fastest,
                           limit: limitOf(round), size: sizeOf(round) });

  Promise.all(pending).then(() => {
    resize();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
