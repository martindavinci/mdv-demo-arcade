<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex</title>
<link rel="icon" href="../img/favicon.png">
<link href="../vendor/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --walnut:#241809; --walnut-2:#3A2712; --candle:#E8B85C; --candle-d:#B07F2E;
    --font:"EB Garamond",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--font); color:var(--parch);
    background:radial-gradient(80% 55% at 50% 8%, #40290F 0%, rgba(64,41,15,0) 68%), #150D05;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:16px 12px; min-height:100%; -webkit-tap-highlight-color:transparent;
  }
  .frame{
    position:relative; aspect-ratio:5/8; width:min(94vw,54vh,470px); height:auto;
    border-radius:calc(var(--u,1) * 8px); overflow:hidden;
    border:1px solid rgba(232,184,92,.28);
    box-shadow:0 28px 64px -20px #000, inset 0 0 0 6px rgba(20,12,4,.55);
    touch-action:manipulation; cursor:pointer;
  }
  canvas{display:block; width:100%; height:100%}

  .panel{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:calc(var(--u)*12px);
    text-align:center; padding:calc(var(--u)*30px);
    background:linear-gradient(180deg, rgba(21,13,5,.42), rgba(21,13,5,.80));
  }
  .panel[hidden]{display:none}
  h1{
    margin:0; font-size:calc(var(--u)*62px); font-weight:600; line-height:.9;
    letter-spacing:calc(var(--u)*1px); color:var(--parch);
    text-shadow:0 calc(var(--u)*3px) calc(var(--u)*18px) rgba(0,0,0,.7);
  }
  .rule{
    width:calc(var(--u)*120px); height:1px; background:var(--candle); opacity:.55;
    position:relative;
  }
  .rule::after{
    content:"❦"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:#231708; color:var(--candle); font-size:calc(var(--u)*15px); padding:0 calc(var(--u)*8px);
  }
  .lede{
    margin:0; max-width:24ch; font-size:calc(var(--u)*19px); font-style:italic;
    color:#E4D2AC; line-height:1.5; opacity:.92;
  }
  .tally{display:flex; gap:calc(var(--u)*36px); align-items:flex-end}
  .tally div{display:flex; flex-direction:column; gap:calc(var(--u)*3px)}
  .tally b{
    font-size:calc(var(--u)*52px); font-weight:600; color:var(--candle); line-height:.9;
  }
  .tally i{font-style:italic; font-size:calc(var(--u)*15px); color:#C4AE85}
  button{
    font-family:var(--font); font-size:calc(var(--u)*21px); font-weight:600;
    color:#2A1B08; background:linear-gradient(180deg,#F0C878,#D9A342); border:0; cursor:pointer;
    padding:calc(var(--u)*11px) calc(var(--u)*32px); border-radius:calc(var(--u)*3px);
    box-shadow:0 calc(var(--u)*4px) 0 #8F6520;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover{transform:translateY(calc(var(--u)*-2px)); box-shadow:0 calc(var(--u)*6px) 0 #8F6520}
  button:active{transform:translateY(calc(var(--u)*3px)); box-shadow:0 calc(var(--u)*1px) 0 #8F6520}
  :focus-visible{outline:2px solid var(--parch); outline-offset:4px}
  .sound{
    position:absolute; top:calc(var(--u)*12px); right:calc(var(--u)*12px);
    width:calc(var(--u)*34px); height:calc(var(--u)*34px); padding:0; border-radius:50%;
    background:rgba(242,227,192,.12); color:var(--parch); box-shadow:none;
    font-size:calc(var(--u)*15px); line-height:1; display:grid; place-items:center;
  }
  .sound:hover{background:rgba(242,227,192,.22); transform:none; box-shadow:none}
  .keys{margin:0; font-size:13px; font-style:italic; color:#7C6847}
  .keys kbd{font-family:inherit; font-style:normal; color:#BBA478;
    background:rgba(255,255,255,.06); border-radius:4px; padding:1px 7px}
  @media (prefers-reduced-motion:reduce){ button{transition:none} }
  .keys a{color:inherit; text-underline-offset:3px}
  .keys a:hover{color:var(--cream, #F4ECDA)}
</style>
</head>
<body>
  <div class="frame" id="frame">
    <canvas id="game"></canvas>

    <div class="panel" id="readyPanel">
      <h1>Codex</h1>
      <div class="rule"></div>
      <p class="lede">The library grows one volume at a time. Drop each book square on the last.</p>
      <button id="startBtn" type="button">Start stacking</button>
    </div>

    <div class="panel" id="overPanel" hidden>
      <h1 id="verdict">The stack falls</h1>
      <div class="rule"></div>
      <div class="tally">
        <div><b id="finalScore">0</b><i>volumes</i></div>
        <div><b id="bestScore">0</b><i>best</i></div>
      </div>
      <button id="againBtn" type="button">Stack again</button>
    </div>

    <button class="sound" id="soundBtn" type="button" aria-label="Mute sound">♪</button>
  </div>
  <p class="keys"><kbd>space</kbd> to drop &nbsp;·&nbsp; tap works too &nbsp;·&nbsp; <a href="../index.html">all games</a></p>

  };
  const sfxFail  = () => { tone(240, 60, 0.45, 'sawtooth', 0.15); };
  soundBtn.addEventListener('click', e => {
    e.stopPropagation(); muted = !muted;
    soundBtn.textContent = muted ? '✕' : '♪';
    soundBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  });

  /* ------------------------------------------------------------ state */
  let state = 'ready', tower, live, debris, sparks, cam, camT, score, best = 0,
      combo, bestCombo, t = 0, shake = 0, catY, catVy, catRot, flashT,
      spawnIn = 0, overIn = 0;

  function reset() {
    const w0 = 208;
    tower = [{ x: (W - w0) / 2, w: w0, lvl: 0, c: 0, off: 0 }];
    live = null; debris = []; sparks = [];
    cam = camT = 0; score = 0; combo = 0; bestCombo = 0;
    catY = 0; catVy = 0; catRot = 0; flashT = 0; shake = 0; spawnIn = 0; overIn = 0;
  }
  reset();

  const dust = Array.from({ length: 34 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: 0.6 + Math.random() * 1.4, s: 5 + Math.random() * 13, p: Math.random() * 6.28
  }));

  // backdrop of shelved spines, drawn once
  const shelf = document.createElement('canvas');
  shelf.width = W; shelf.height = 240;
  (() => {
    const c = shelf.getContext('2d');
    let seed = 9;
    const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    for (let row = 0; row < 3; row++) {
      const y = row * 80;
      c.fillStyle = '#1A1006'; c.fillRect(0, y + 62, W, 18);
      let x = 0;
      while (x < W) {
        const w = 9 + rnd() * 15, h = 40 + rnd() * 20;
        c.fillStyle = `hsl(${18 + rnd() * 34},${14 + rnd() * 16}%,${9 + rnd() * 9}%)`;
        c.fillRect(x, y + 62 - h, w - 2, h);
        if (rnd() > 0.6) {
          c.fillStyle = 'rgba(232,184,92,0.12)';
          c.fillRect(x, y + 62 - h * 0.72, w - 2, 2);
        }
        x += w;
      }
    }
  })();

  /* ------------------------------------------------------------- flow */
  const readyPanel = document.getElementById('readyPanel');
  const overPanel = document.getElementById('overPanel');

  function topBlock() { return tower[tower.length - 1]; }
  function spawn() {
    const top = topBlock();
    const lvl = top.lvl + 1;
    const speed = Math.min(330, 122 + lvl * 4.6);
    live = { x: lvl % 2 ? W - 14 - top.w : 14, w: top.w, lvl,
             c: lvl % COVERS.length, dir: lvl % 2 ? -1 : 1, speed, off: 0 };
  }
  function start() {
    reset(); state = 'play';
    readyPanel.hidden = true; overPanel.hidden = true;
    spawn();
  }
  function blockY(lvl) { return FLOOR - (lvl + 1) * BH + cam; }

  function drop() {
    if (!live) return;
    const top = topBlock();
    const left = Math.max(live.x, top.x), right = Math.min(live.x + live.w, top.x + top.w);
    const overlap = right - left;
    const dx = live.x - top.x;

    if (overlap <= 0) {                       // missed the stack entirely
      debris.push({ x: live.x, y: blockY(live.lvl), w: live.w, c: live.c,
                    vx: live.dir * 40, vy: -60, rot: 0, vr: live.dir * 3, life: 0 });
      live = null; fail(); return;
    }
    if (Math.abs(dx) <= 4) {                  // perfect
      combo++; bestCombo = Math.max(bestCombo, combo);
      const grow = combo >= 3 ? Math.min(6, 208 - top.w) : 0;
      tower.push({ x: top.x - grow / 2, w: top.w + grow, lvl: live.lvl, c: live.c, off: 0 });
      sfxPerfect(combo);
      for (let i = 0; i < 8; i++) burst(left + overlap / 2, blockY(live.lvl) + BH / 2);
      flashT = 0.4;
    } else {                                  // trim the overhang
      combo = 0;
      const cut = dx > 0 ? { x: top.x + top.w, w: dx } : { x: live.x, w: -dx };
      debris.push({ x: cut.x, y: blockY(live.lvl), w: cut.w, c: live.c,
                    vx: (dx > 0 ? 70 : -70), vy: -40, rot: 0, vr: (dx > 0 ? 4 : -4), life: 0 });
      tower.push({ x: left, w: overlap, lvl: live.lvl, c: live.c, off: 0 });
      sfxDrop(); sfxTrim();
      shake = reduce ? 0 : 5;
    }
    score++;
    tower[tower.length - 1].off = 9;           // squash on landing
    catVy = -170;
    camT = Math.max(0, (live.lvl - REST) * BH);
    live = null; spawnIn = 0.07;
  }

  function fail() {
    state = 'toppling'; sfxFail(); shake = reduce ? 0 : 14; catVy = -230; overIn = 1.15;
  }
  function settle() {
    state = 'over';
    best = Math.max(best, score);
    document.getElementById('finalScore').textContent = score;
    document.getElementById('bestScore').textContent = best;
    document.getElementById('verdict').textContent =
      score === 0 ? 'Not one volume' :
      score < 8 ? 'A modest shelf' :
      score < 18 ? 'A respectable stack' :
      score < 32 ? 'A fine collection' : 'The great library';
    overPanel.hidden = false;
  }

  function burst(x, y) {
    const a = Math.random() * 6.28, sp = 50 + Math.random() * 130;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
                  rot: a, vr: (Math.random() - .5) * 7, life: 0, max: 0.6,
                  size: 11 + Math.random() * 12 });
  }

  function input() {
    if (state === 'ready') start();
    else if (state === 'play') drop();
    else if (state === 'over') start();
  }
  frame.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault(); input();
  });
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'Enter') {
      if (document.activeElement && /^(BUTTON|A)$/.test(document.activeElement.tagName) && e.code === 'Enter') return;
      e.preventDefault(); if (!e.repeat) input();   // a held key presses once
    }
  });
  document.getElementById('startBtn').addEventListener('click', e => { e.stopPropagation(); start(); });
  document.getElementById('againBtn').addEventListener('click', e => { e.stopPropagation(); start(); });

  /* ------------------------------------------------------------ logic */
  function step(dt) {
    t += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 36);
    if (flashT > 0) flashT = Math.max(0, flashT - dt * 2.4);
    cam += (camT - cam) * Math.min(1, dt * 7);

    if (state === 'play' && !live) {
      spawnIn -= dt;
      if (spawnIn <= 0) spawn();
    }
    if (state === 'toppling') {
      overIn -= dt;
      if (overIn <= 0) settle();
    }

    if (live && state === 'play') {
      live.x += live.dir * live.speed * dt;
      const lo = 12, hi = W - 12 - live.w;
      if (live.x < lo) { live.x = lo; live.dir = 1; }
      if (live.x > hi) { live.x = hi; live.dir = -1; }
    }
    for (const b of tower) if (b.off > 0) b.off = Math.max(0, b.off - dt * 44);

    for (const d of debris) {
      d.life += dt; d.vy += 1500 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    }
    debris = debris.filter(d => d.y < H + 160);

    for (const s of sparks) {
      s.life += dt; s.vy += 120 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
    }
    sparks = sparks.filter(s => s.life < s.max);

    // cat perched on the stack
    if (state === 'toppling' || state === 'over') {
      catVy += 1500 * dt; catY += catVy * dt; catRot += dt * 5.5;
    } else {
      catVy += 1500 * dt; catY += catVy * dt;
      if (catY > 0) { catY = 0; catVy = 0; }
      catRot += (0 - catRot) * Math.min(1, dt * 8);
    }
    for (const p of dust) {
      p.y -= p.s * dt; if (p.y < -6) { p.y = H + 6; p.x = Math.random() * W; }
    }
  }

  /* ------------------------------------------------------------- draw */
  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawBook(x, y, w, h, ci, alpha) {
    const [a, b] = COVERS[ci % COVERS.length];
    ctx.save();
    if (alpha != null) ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; roundRect(x, y, w, h, 4); ctx.fill();
    ctx.strokeStyle = '#1B1007'; ctx.lineWidth = 2; ctx.stroke();
    if (w > 26) {                                    // page block
      ctx.fillStyle = '#E9D9B4';
      roundRect(x + w - 11, y + 4, 8, h - 8, 2); ctx.fill();
      ctx.strokeStyle = 'rgba(90,66,32,.45)'; ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(x + w - 10, y + 4 + i * (h - 8) / 4);
        ctx.lineTo(x + w - 4, y + 4 + i * (h - 8) / 4); ctx.stroke();
      }
    }
    if (w > 46) {                                    // gilt bands + title dash
      ctx.fillStyle = 'rgba(232,184,92,.85)';
      ctx.fillRect(x + 9, y + 3, 3.5, h - 6);
      ctx.fillRect(x + 17, y + 3, 2, h - 6);
      ctx.fillRect(x + w * 0.42, y + h / 2 - 2, Math.min(28, w * 0.24), 3.5);
    }
    ctx.fillStyle = 'rgba(255,238,200,.13)';
    ctx.fillRect(x + 3, y + 3, w - 6, 3);
    ctx.restore();
  }

  function drawCat() {
    const top = topBlock();
    if (!top) return;
    const y = blockY(top.lvl), w = 62, h = w * 152 / 140;
    const sprite = (state === 'toppling' || state === 'over') ? img.fall
      : (combo >= 3 ? img.cheer : img.sit);
    ctx.save();
    ctx.translate(top.x + top.w / 2, y + catY + top.off * 0.5);
    ctx.rotate(catRot);
    ctx.drawImage(sprite, -w / 2, -h + 4, w, h);
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2E1E0B'); g.addColorStop(0.45, '#241809'); g.addColorStop(1, '#170E05');
    ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

    ctx.globalAlpha = 0.4;
    const off = (cam * 0.28) % 240;
    for (let y = -240 + off; y < H; y += 240) ctx.drawImage(shelf, 0, y);
    ctx.globalAlpha = 1;

    const glow = ctx.createRadialGradient(W / 2, 90, 10, W / 2, 90, 340);
    glow.addColorStop(0, 'rgba(232,184,92,.16)'); glow.addColorStop(1, 'rgba(232,184,92,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    for (const p of dust) {
      ctx.globalAlpha = 0.18 + 0.2 * Math.abs(Math.sin(t * 0.7 + p.p));
      ctx.fillStyle = '#F4E3BC';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // desk the stack rests on
    const deskY = blockY(-1);
    ctx.fillStyle = '#4A3117'; ctx.fillRect(40, deskY + 2, W - 80, 16);
    ctx.fillStyle = '#2F1E0C'; ctx.fillRect(40, deskY + 16, W - 80, 10);

    for (const d of debris) {
      ctx.save(); ctx.translate(d.x + d.w / 2, d.y + BH / 2); ctx.rotate(d.rot);
      drawBook(-d.w / 2, -BH / 2, d.w, BH, d.c, Math.max(0, 1 - d.life * 0.5));
      ctx.restore();
    }

    for (const b of tower) {
      const y = blockY(b.lvl);
      if (y > H + BH || y < -BH * 2) continue;
      drawBook(b.x - b.off / 2, y + b.off, b.w + b.off, BH - b.off, b.c);
    }
    if (live) drawBook(live.x, blockY(live.lvl), live.w, BH, live.c);

    drawCat();

    for (const s of sparks) {
      const k = 1 - s.life / s.max;
      ctx.save(); ctx.globalAlpha = Math.min(1, k * 1.7);
      ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.drawImage(img.spark, -s.size / 2, -s.size / 2, s.size, s.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (state === 'play' || state === 'toppling') {
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '600 58px "EB Garamond",Georgia,serif';
      ctx.fillStyle = 'rgba(242,227,192,.92)';
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 14;
      ctx.fillText(score, W / 2, 74);
      if (combo >= 2) {
        ctx.font = 'italic 500 19px "EB Garamond",Georgia,serif';
        ctx.fillStyle = '#E8B85C';
        ctx.fillText('perfect ×' + combo, W / 2, 116);
      }
      ctx.restore();
    }
    ctx.restore();

    if (flashT > 0) {
      ctx.fillStyle = `rgba(232,184,92,${flashT * 0.13})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* -------------------------------------------------------- main loop */
  function resize() {
    const r = frame.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    document.documentElement.style.setProperty('--u', (r.width / W).toFixed(4));
  }
  addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(frame);

  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt;
    while (acc > 1 / 120) { step(1 / 120); acc -= 1 / 120; }
    render();
    requestAnimationFrame(loop);
  }

  Promise.all(pending).then(() => {
    resize();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
