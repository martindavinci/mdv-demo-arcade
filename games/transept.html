<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transept</title>
<link rel="icon" href="../img/favicon.png">
<link href="../vendor/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --warm:#3A2A16; --cool:#1E2740; --stone:#C9BB99; --gold:#E8B85C;
    --moon:#A9C0DC; --cream:#F1E8D4;
    --font:"EB Garamond",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--font); color:var(--cream);
    background:linear-gradient(180deg,#2A2013 0%,#1A1A2C 50%,#161E33 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:16px 12px; min-height:100%; -webkit-tap-highlight-color:transparent;
  }
  .frame{
    position:relative; aspect-ratio:5/8; width:min(94vw,54vh,470px); height:auto;
    border-radius:calc(var(--u,1)*10px); overflow:hidden;
    border:1px solid rgba(201,187,153,.24);
    box-shadow:0 28px 66px -20px #000;
    touch-action:manipulation; cursor:pointer;
  }
  canvas{display:block; width:100%; height:100%}
  .panel{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:calc(var(--u)*12px);
    text-align:center; padding:calc(var(--u)*30px);
    background:linear-gradient(180deg, rgba(40,30,16,.72), rgba(20,26,44,.80));
  }
  .panel[hidden]{display:none}
  h1{
    margin:0; font-size:calc(var(--u)*50px); font-weight:600; line-height:.92;
    color:var(--cream); text-shadow:0 calc(var(--u)*3px) calc(var(--u)*20px) rgba(0,0,0,.8);
  }
  .rule{width:calc(var(--u)*118px); height:1px; background:var(--stone); opacity:.55; position:relative}
  .rule::after{
    content:"✛"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:#2C2A2C; color:var(--stone); font-size:calc(var(--u)*13px); padding:0 calc(var(--u)*8px);
  }
  .lede{margin:0; max-width:25ch; font-size:calc(var(--u)*19px); font-style:italic;
        color:#D6CDBA; line-height:1.5}
  .tally{display:flex; gap:calc(var(--u)*30px)}
  .tally div{display:flex; flex-direction:column; gap:calc(var(--u)*3px)}
  .tally b{font-size:calc(var(--u)*44px); font-weight:600; color:var(--gold); line-height:.9}
  .tally i{font-style:italic; font-size:calc(var(--u)*14px); color:#ADA694}
  button{
    font-family:var(--font); font-size:calc(var(--u)*21px); font-weight:600;
    color:#1C1405; background:linear-gradient(180deg,#F0C878,#D9A342); border:0; cursor:pointer;
    padding:calc(var(--u)*11px) calc(var(--u)*32px); border-radius:calc(var(--u)*3px);
    box-shadow:0 calc(var(--u)*4px) 0 #8F6520;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover{transform:translateY(calc(var(--u)*-2px)); box-shadow:0 calc(var(--u)*6px) 0 #8F6520}
  button:active{transform:translateY(calc(var(--u)*3px)); box-shadow:0 calc(var(--u)*1px) 0 #8F6520}
  :focus-visible{outline:2px solid var(--cream); outline-offset:4px}
  .sound{
    position:absolute; top:calc(var(--u)*12px); right:calc(var(--u)*12px);
    width:calc(var(--u)*34px); height:calc(var(--u)*34px); padding:0; border-radius:50%;
    background:rgba(241,232,212,.14); color:var(--cream); box-shadow:none;
    font-size:calc(var(--u)*15px); line-height:1; display:grid; place-items:center;
  }
  .sound:hover{background:rgba(241,232,212,.24); transform:none; box-shadow:none}
  .keys{margin:0; font-size:13px; font-style:italic; color:#7A7365}
  .keys kbd{font-family:inherit; font-style:normal; color:#B9AF9B;
    background:rgba(255,255,255,.06); border-radius:4px; padding:1px 7px}
  @media (prefers-reduced-motion:reduce){ button{transition:none} }
</style>
</head>
<body>
  <div class="frame" id="frame">
    <canvas id="game"></canvas>
    <div class="panel" id="readyPanel">
      <h1>Transept</h1>
      <div class="rule"></div>
      <p class="lede">Two cats, one leap. What saves the one above can bury the one below.</p>
      <button id="startBtn" type="button">Cross together</button>
    </div>
    <div class="panel" id="overPanel" hidden>
      <h1 id="verdict">One of you stumbled</h1>
      <div class="rule"></div>
      <div class="tally">
        <div><b id="finalScore">0</b><i>paces</i></div>
        <div><b id="finalGold">0</b><i>coins</i></div>
        <div><b id="bestScore">0</b><i>best</i></div>
      </div>
      <button id="againBtn" type="button">Again</button>
    </div>
    <button class="sound" id="soundBtn" type="button" aria-label="Mute sound">♪</button>
  </div>
  <p class="keys"><kbd>space</kbd> leaps both &nbsp;·&nbsp; tap works too</p>

      if (roll < 0.62) {
        // a pair: the offset stays inside one leap, so a single jump can clear both
        const maxOff = Math.min(0.30 * L, 62) * (0.4 + 0.6 * hard);
        const b1 = block(), b2 = block();
        hazards.push({ x: nextX, side: 0, ...b1 });
        hazards.push({ x: nextX + (rnd() - 0.5) * 2 * maxOff, side: 1, ...b2 });
      } else if (roll < 0.81) {
        hazards.push({ x: nextX, side: 0, ...block() });
      } else {
        hazards.push({ x: nextX, side: 1, ...block() });
      }
      // next event far enough away to land and leap again
      nextX += Math.max(L + 110, 470 - dist * 0.022) + rnd() * 150;
      if (rnd() < 0.7) {
        const side = rnd() < 0.5 ? 0 : 1;
        coins.push({ x: nextX - 150 - rnd() * 90, side, h: 40 + rnd() * 34, got: false });
      }
    }
    hazards = hazards.filter(h => h.x + h.w > dist - 60);
    coins = coins.filter(c => c.x > dist - 60);
  }
  reset();

  /* ------------------------------------------------------------- flow */
  const readyPanel = document.getElementById('readyPanel');
  const overPanel = document.getElementById('overPanel');

  function start() {
    reset(); state = 'run';
    readyPanel.hidden = true; overPanel.hidden = true;
  }
  function leap() {
    if (air) return;
    air = true; vy = JV; sfxJump();
  }
  function die(side) {
    state = 'hit'; deadSide = side; deadT = 0;
    sfxHit(); shake = reduce ? 0 : 12; flashT = 0.5;
  }
  function settle() {
    state = 'over';
    const m = Math.floor(dist / 10);
    best = Math.max(best, m);
    document.getElementById('finalScore').textContent = m;
    document.getElementById('finalGold').textContent = gold;
    document.getElementById('bestScore').textContent = best;
    document.getElementById('verdict').textContent =
      m < 20 ? 'One of you stumbled' :
      m < 60 ? 'They nearly kept step' :
      m < 140 ? 'Two minds, one leap' :
      m < 260 ? 'The crossing is yours' : 'Perfectly transposed';
    overPanel.hidden = false;
  }
  function input() {
    if (state === 'ready') start();
    else if (state === 'run') leap();
    else if (state === 'over') start();
  }
  frame.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault(); input();
  });
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && e.code === 'Enter') return;
      if (e.repeat) return;
      e.preventDefault(); input();
    }
  });
  document.getElementById('startBtn').addEventListener('click', e => { e.stopPropagation(); start(); });
  document.getElementById('againBtn').addEventListener('click', e => { e.stopPropagation(); start(); });

  function burst(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, sp = 40 + Math.random() * 120;
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
                    rot: a, vr: (Math.random() - .5) * 8, life: 0, max: 0.5,
                    size: 9 + Math.random() * 11 });
    }
  }
  const surfaceY = side => side === 0 ? TOP_Y : BOT_Y;
  const catY = side => side === 0 ? TOP_Y - off : BOT_Y + off;

  /* ------------------------------------------------------------ logic */
  function step(dt) {
    t += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 32);
    if (flashT > 0) flashT = Math.max(0, flashT - dt * 2.4);

    if (state === 'run') {
      dist += speed() * dt;
      anim += dt * 11;
      if (air) {
        vy -= G * dt; off += vy * dt;
        if (off <= 0) { off = 0; vy = 0; air = false; sfxLand(); }
      }
      grow();

      for (const h of hazards) {
        const hx = h.x - dist;
        if (hx > CATX + 17 || hx + h.w < CATX - 17) continue;
        if (off < h.h + 3) { die(h.side); break; }
      }
      if (state === 'run') {
        for (const c of coins) {
          if (c.got) continue;
          const cx = c.x - dist;
          if (Math.abs(cx - CATX) < 22 && Math.abs(off - c.h) < 26) {
            c.got = true; gold++; sfxCoin();
            burst(CATX, catY(c.side), 5);
          }
        }
      }
    } else if (state === 'hit') {
      deadT += dt;
      off += (deadSide === 0 ? -1 : 1) * 0 + 0;         // the pair freezes where they fell
      if (deadT > 0.9) settle();
    }

    for (const s of sparks) {
      s.life += dt; s.vy += 110 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
    }
    sparks = sparks.filter(s => s.life < s.max);
  }

  /* ------------------------------------------------------------- draw */
  function arches(y0, y1, warm) {
    const per = 190, o = (dist * 0.34) % per;
    ctx.strokeStyle = warm ? 'rgba(232,184,92,.10)' : 'rgba(169,192,220,.10)';
    ctx.lineWidth = 9;
    for (let x = -o; x < W + per; x += per) {
      ctx.beginPath();
      if (warm) {
        ctx.moveTo(x, y1); ctx.lineTo(x, y0 + 70);
        ctx.arc(x + 62, y0 + 70, 62, Math.PI, 0);
        ctx.lineTo(x + 124, y1);
      } else {
        ctx.moveTo(x, y0); ctx.lineTo(x, y1 - 70);
        ctx.arc(x + 62, y1 - 70, 62, Math.PI, 0, true);
        ctx.lineTo(x + 124, y0);
      }
      ctx.stroke();
    }
  }

  function drawHazard(h) {
    const x = h.x - dist;
    if (x > W + 40 || x + h.w < -40) return;
    const y = h.side === 0 ? TOP_Y - h.h : BOT_Y;
    const g = ctx.createLinearGradient(x, y, x + h.w, y);
    if (h.side === 0) { g.addColorStop(0, '#B8A67F'); g.addColorStop(1, '#7E6E4E'); }
    else { g.addColorStop(0, '#8496B4'); g.addColorStop(1, '#5A6880'); }
    ctx.fillStyle = g; ctx.fillRect(x, y, h.w, h.h);
    ctx.fillStyle = h.side === 0 ? '#D6C69C' : '#A3B4CE';
    ctx.fillRect(x - 3, h.side === 0 ? y : y + h.h - 5, h.w + 6, 5);
    ctx.strokeStyle = 'rgba(28,24,18,.5)'; ctx.lineWidth = 1.6;
    ctx.strokeRect(x, y, h.w, h.h);
  }

  function drawCat(side) {
    const warm = side === 0;
    const dead = state !== 'run' && deadSide === side;
    const sprite = dead ? (warm ? img.wf : img.cf)
                        : (Math.floor(anim) % 2 ? (warm ? img.wb : img.cb)
                                                : (warm ? img.wa : img.ca));
    ctx.save();
    ctx.translate(CATX, catY(side));
    if (!warm) ctx.scale(1, -1);                       // the lower aisle is a mirror
    if (air) ctx.rotate(Math.max(-0.3, Math.min(0.3, -vy / 2600)));
    ctx.drawImage(sprite, -CAT_W / 2, -CAT_H, CAT_W, CAT_H);
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    const gw = ctx.createLinearGradient(0, 0, 0, TOP_Y);
    gw.addColorStop(0, '#2A1E10'); gw.addColorStop(1, '#4A3517');
    ctx.fillStyle = gw; ctx.fillRect(0, 0, W, TOP_Y);
    const gc = ctx.createLinearGradient(0, BOT_Y, 0, H);
    gc.addColorStop(0, '#222C48'); gc.addColorStop(1, '#141B2E');
    ctx.fillStyle = gc; ctx.fillRect(0, BOT_Y, W, H - BOT_Y);

    arches(0, TOP_Y, true);
    arches(BOT_Y, H, false);

    // candle glow above, moonlight below
    const fl = 0.85 + 0.15 * Math.sin(t * 9);
    let rg = ctx.createRadialGradient(W / 2, 90, 10, W / 2, 90, 260 * fl);
    rg.addColorStop(0, 'rgba(240,200,120,.16)'); rg.addColorStop(1, 'rgba(240,200,120,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, TOP_Y);
    rg = ctx.createRadialGradient(W / 2, H - 90, 10, W / 2, H - 90, 260);
    rg.addColorStop(0, 'rgba(169,192,220,.14)'); rg.addColorStop(1, 'rgba(169,192,220,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, BOT_Y, W, H - BOT_Y);

    for (const c of coins) {
      if (c.got) continue;
      const x = c.x - dist;
      if (x < -30 || x > W + 30) continue;
      const y = c.side === 0 ? TOP_Y - c.h : BOT_Y + c.h;
      ctx.drawImage(img.coin, x - 12, y - 12 + Math.sin(t * 3 + c.x) * 2, 24, 24);
    }

    for (const h of hazards) drawHazard(h);
    drawCat(0); drawCat(1);

    // the slab between the two aisles
    const sg = ctx.createLinearGradient(0, TOP_Y, 0, BOT_Y);
    sg.addColorStop(0, '#6B6350'); sg.addColorStop(0.5, '#3E3A30'); sg.addColorStop(1, '#4E5464');
    ctx.fillStyle = sg; ctx.fillRect(0, TOP_Y, W, BOT_Y - TOP_Y);
    ctx.fillStyle = '#D6C69C'; ctx.fillRect(0, TOP_Y - 5, W, 5);
    ctx.fillStyle = '#A3B4CE'; ctx.fillRect(0, BOT_Y, W, 5);
    ctx.strokeStyle = 'rgba(20,18,14,.4)'; ctx.lineWidth = 1;
    for (let x = -(dist % 46); x < W; x += 46) {
      ctx.beginPath(); ctx.moveTo(x, TOP_Y); ctx.lineTo(x, BOT_Y); ctx.stroke();
    }

    for (const s of sparks) {
      const k = 1 - s.life / s.max;
      ctx.save(); ctx.globalAlpha = Math.min(1, k * 1.7);
      ctx.translate(s.x, s.y); ctx.rotate(s.rot);
      ctx.drawImage(img.spark, -s.size / 2, -s.size / 2, s.size, s.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    if (state !== 'ready') {
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '600 34px "EB Garamond",Georgia,serif';
      ctx.fillStyle = '#F1E8D4';
      ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 8;
      ctx.fillText(Math.floor(dist / 10), W / 2, (TOP_Y + BOT_Y) / 2);
      ctx.restore();
      ctx.drawImage(img.coin, 14, 16, 22, 22);
      ctx.save();
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = '600 22px "EB Garamond",Georgia,serif';
      ctx.fillStyle = '#E8B85C'; ctx.fillText(gold, 42, 27);
      ctx.restore();
    }
    ctx.restore();

    if (flashT > 0) {                                   // the half that failed lights up
      ctx.fillStyle = `rgba(216,90,70,${flashT * 0.22})`;
      if (deadSide === 0) ctx.fillRect(0, 0, W, TOP_Y);
      else ctx.fillRect(0, BOT_Y, W, H - BOT_Y);
    }
  }

  /* -------------------------------------------------------- main loop */
  function resize() {
    const r = frame.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    document.documentElement.style.setProperty('--u', (r.width / W).toFixed(4));
  }
  addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(frame);

  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt;
    while (acc > 1 / 120) { step(1 / 120); acc -= 1 / 120; }
    render();
    requestAnimationFrame(loop);
  }

  if (window.__TR_TEST)                       // read-only hook for the test harness
    window.__tr = () => ({ state, off, vy, air, hazards, coins, dist, gold,
                           speed: speed(), CATX, G, JV });

  Promise.all(pending).then(() => {
    resize();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
