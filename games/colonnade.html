<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colonnade</title>
<link rel="icon" href="../img/favicon.png">
<link href="../vendor/fonts/fonts.css" rel="stylesheet">
<style>
  :root{
    --night:#16122E; --sky:#322C5E; --plum:#4A3A63;
    --gold:#FFD166; --gold-deep:#E0A33A;
    --cream:#FCE7CD; --mist:#FBF8FF; --lilac:#B9AEDD;
    --ink:#5E3320;
    --font:"Baloo 2","Trebuchet MS",ui-rounded,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--font); color:var(--mist);
    background:
      radial-gradient(90% 60% at 50% 12%, #3B3168 0%, rgba(59,49,104,0) 70%),
      var(--night);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:calc(var(--u,1) * 14px); padding:16px 12px; min-height:100%;
    -webkit-tap-highlight-color:transparent;
  }
  .frame{
    position:relative; aspect-ratio:5/8;
    width:min(94vw, 54vh, 470px); height:auto;
    border-radius:calc(var(--u,1) * 26px); overflow:hidden;
    border:2px solid rgba(255,209,102,.34);
    box-shadow:0 26px 70px -18px #05020F, 0 0 0 10px rgba(255,255,255,.02);
    touch-action:manipulation; cursor:pointer; isolation:isolate;
  }
  canvas{display:block; width:100%; height:100%}

  /* ---- overlays ---- */
  .panel{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:calc(var(--u) * 10px);
    text-align:center; padding:calc(var(--u) * 28px);
    background:linear-gradient(180deg, rgba(22,18,46,.18), rgba(22,18,46,.62));
    opacity:1; transition:opacity .22s ease;
  }
  .panel[hidden]{display:none}
  h1{
    margin:0; font-size:calc(var(--u) * 44px); font-weight:800; line-height:.96;
    color:var(--cream); letter-spacing:calc(var(--u) * -.6px);
    text-shadow:0 calc(var(--u)*4px) 0 var(--ink), 0 calc(var(--u)*10px) calc(var(--u)*22px) rgba(0,0,0,.45);
  }
  h1 span{display:block; color:var(--gold)}
  .lede{
    margin:0; max-width:26ch; font-size:calc(var(--u) * 17px); font-weight:500;
    color:#DED7F5; line-height:1.45;
  }
  .over-score{
    display:flex; gap:calc(var(--u) * 34px); margin-top:calc(var(--u) * 2px);
  }
  .over-score div{display:flex; flex-direction:column; gap:calc(var(--u) * 2px)}
  .over-score b{
    font-size:calc(var(--u) * 44px); font-weight:800; color:var(--gold); line-height:1;
    text-shadow:0 calc(var(--u)*3px) 0 rgba(94,51,32,.75);
  }
  .over-score i{font-style:normal; font-size:calc(var(--u)*14px); color:#C6BDE8; font-weight:600}
  .ribbon{
    font-size:calc(var(--u)*14px); font-weight:600; color:var(--night);
    background:var(--gold); padding:calc(var(--u)*4px) calc(var(--u)*12px);
    border-radius:999px; box-shadow:0 calc(var(--u)*3px) 0 var(--gold-deep);
  }
  button{
    font-family:var(--font); font-size:calc(var(--u) * 19px); font-weight:700;
    color:#3A2216; background:var(--gold); border:0; cursor:pointer;
    padding:calc(var(--u)*13px) calc(var(--u)*30px); border-radius:999px;
    box-shadow:0 calc(var(--u)*6px) 0 var(--gold-deep);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover{transform:translateY(calc(var(--u)*-2px)); box-shadow:0 calc(var(--u)*8px) 0 var(--gold-deep)}
  button:active{transform:translateY(calc(var(--u)*4px)); box-shadow:0 calc(var(--u)*2px) 0 var(--gold-deep)}
  :focus-visible{outline:3px solid var(--mist); outline-offset:4px}

  .sound{
    position:absolute; top:calc(var(--u)*14px); right:calc(var(--u)*14px);
    width:calc(var(--u)*38px); height:calc(var(--u)*38px); padding:0; border-radius:50%;
    background:rgba(251,248,255,.14); color:var(--mist); box-shadow:none;
    font-size:calc(var(--u)*17px); line-height:1; display:grid; place-items:center;
  }
  .sound:hover{background:rgba(251,248,255,.26); transform:none; box-shadow:none}
  .keys{
    margin:0; font-size:13px; font-weight:500; color:#8C83B8; letter-spacing:.01em;
  }
  .keys kbd{
    font-family:inherit; font-weight:700; color:#CFC6F0;
    background:rgba(255,255,255,.07); border-radius:6px; padding:1px 7px;
  }
  @media (prefers-reduced-motion:reduce){ button{transition:none} }
  .keys a{color:inherit; text-underline-offset:3px}
  .keys a:hover{color:var(--cream, #F4ECDA)}
</style>
</head>
<body>
  <div class="frame" id="frame">
    <canvas id="game"></canvas>

    <div class="panel" id="readyPanel">
      <h1>Colonnade</h1>
      <p class="lede">Nine lives spent, one pair of wings earned. Flap through the gates and see how far you get.</p>
      <button id="startBtn" type="button">Start flying</button>
    </div>

    <div class="panel" id="overPanel" hidden>
      <p class="ribbon" id="verdict">Down one life</p>
      <div class="over-score">
        <div><b id="finalScore">0</b><i>gates</i></div>
        <div><b id="bestScore">0</b><i>best</i></div>
      </div>
      <button id="againBtn" type="button">Fly again</button>
    </div>

    <button class="sound" id="soundBtn" type="button" aria-label="Mute sound">♪</button>
  </div>
  <p class="keys"><kbd>space</kbd> to flap &nbsp;·&nbsp; tap works too &nbsp;·&nbsp; <a href="../index.html">all games</a></p>

  function settle() {
    state = 'over';
    best = Math.max(best, score);
    document.getElementById('finalScore').textContent = score;
    document.getElementById('bestScore').textContent = best;
    document.getElementById('verdict').textContent =
      score === 0 ? 'Straight into the marble' :
      score < 5   ? 'Down one life' :
      score < 12  ? 'Respectable haunting' :
      score < 25  ? 'Seasoned sky cat' : 'Officially seraphic';
    overPanel.hidden = false;
  }
  function input() {
    if (state === 'ready') start();
    else if (state === 'play') flap();
    else if (state === 'over') start();
  }
  frame.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault(); input();
  });
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      if (document.activeElement && /^(BUTTON|A)$/.test(document.activeElement.tagName) && e.code === 'Enter') return;
      e.preventDefault(); input();
    }
  });
  document.getElementById('startBtn').addEventListener('click', e => { e.stopPropagation(); start(); });
  document.getElementById('againBtn').addEventListener('click', e => { e.stopPropagation(); start(); });

  /* -------------------------------------------------------- particles */
  function puff(x, y) {
    parts.push({ k: 'f', x, y, vx: -60 - Math.random() * 70, vy: 30 + Math.random() * 60,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * 5, life: 0, max: 0.8, size: 13 + Math.random() * 7 });
  }
  function burst(x, y) {
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * 6.28, sp = 40 + Math.random() * 110;
      parts.push({ k: 's', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
        rot: a, vr: (Math.random() - .5) * 6, life: 0, max: 0.55, size: 10 + Math.random() * 12 });
    }
  }

  /* ------------------------------------------------------------ logic */
  function step(dt) {
    t += dt;
    if (shake > 0) shake = Math.max(0, shake - dt * 34);
    if (flash > 0) flash = Math.max(0, flash - dt * 3.4);

    const moving = state === 'play';
    const drift = moving ? speed : (state === 'ready' ? 26 : 0);
    for (const c of clouds) {
      c.x -= drift * c.d * dt;
      if (c.x < -200) { c.x = W + 40 + Math.random() * 90; c.y = 40 + Math.random() * 330; }
    }

    if (state === 'ready') {
      cat.y = 250 + Math.sin(t * 2.3) * 14;
      cat.rot = Math.sin(t * 2.3) * 0.08;
      cat.wing = (cat.wing + dt * 4.6) % 3;
      blinkT -= dt;
    } else if (state === 'play' || state === 'dying') {
      cat.vy = Math.min(cat.vy + 1420 * dt, 760);
      cat.y += cat.vy * dt;
      cat.flap = Math.max(0, cat.flap - dt * 3.2);
      cat.wing = (cat.wing + dt * (state === 'play' ? 13 : 2)) % 3;
      const target = cat.vy < 0 ? -0.42 : Math.min(1.5, cat.vy / 620);
      cat.rot += (target - cat.rot) * Math.min(1, dt * 9);
      if (cat.y < -CAT_H * 0.4) { cat.y = -CAT_H * 0.4; cat.vy = 0; }
    }

    if (state === 'play') {
      speed = Math.min(206, 148 + score * 2.1);
      spawnX -= speed * dt;
      if (spawnX <= W) {
        const gap = Math.max(150, 176 - score * 1.1);
        const top = 76 + Math.random() * (GROUND_Y - 150 - gap - 76);
        gates.push({ x: W + 10, top, gap, passed: false });
        spawnX = W + 10 + 248;
      }
      for (const g of gates) {
        g.x -= speed * dt;
        if (!g.passed && g.x + GATE_W < cat.x + CAT_W * 0.5) {
          g.passed = true; score++; sfxScore();
          burst(cat.x + CAT_W * 0.5, cat.y + CAT_H * 0.5);
        }
      }
      gates = gates.filter(g => g.x > -GATE_W - 20);

      // collision: forgiving circle against the two columns
      const cx = cat.x + CAT_W * 0.48, cy = cat.y + CAT_H * 0.56, r = CAT_W * 0.25;
      for (const g of gates) {
        const gx = g.x + 5, gw = GATE_W - 10;
        if (hitRect(cx, cy, r, gx, -400, gw, g.top + 400) ||
            hitRect(cx, cy, r, gx, g.top + g.gap, gw, GROUND_Y)) { die(false); break; }
      }
      if (cy + r >= GROUND_Y) { cat.y = GROUND_Y - r - CAT_H * 0.56; die(true); }
    } else if (state === 'dying') {
      const cy = cat.y + CAT_H * 0.56, r = CAT_W * 0.25;
      if (cy + r >= GROUND_Y) {
        cat.y = GROUND_Y - r - CAT_H * 0.56; cat.vy = 0; sfxDrop(); settle();
      }
    }

    for (const p of parts) {
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.k === 'f') { p.vy += 120 * dt; p.vx *= 0.985; }
      else { p.vy += 60 * dt; }
    }
    parts = parts.filter(p => p.life < p.max);
    if (state === 'ready' && blinkT < 0) blinkT = 2.4 + Math.random() * 3.4;
  }

  function hitRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  /* ------------------------------------------------------------- draw */
  let sky = null;
  function makeSky() {
    sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#171341');
    sky.addColorStop(0.40, '#2B2458');
    sky.addColorStop(0.68, '#46386F');
    sky.addColorStop(0.80, '#8A6A93');
    sky.addColorStop(0.87, '#D79A92');
    sky.addColorStop(1, '#F0AE84');
  }

  function drawGate(g) {
    const capH = GATE_W * (520 * CAP_FRAC) / 100;
    const bi = img.gateBottom, ti = img.gateTop;
    const capSrcB = bi.height * CAP_FRAC, capSrcT = ti.height * CAP_FRAC;
    // top column, capital hanging at the gap edge
    const tCapY = g.top - capH;
    const tShaftH = tCapY + 40;
    if (tShaftH > 0)
      ctx.drawImage(ti, 0, 0, ti.width, ti.height - capSrcT, g.x, -40, GATE_W, tShaftH);
    ctx.drawImage(ti, 0, ti.height - capSrcT, ti.width, capSrcT, g.x, tCapY, GATE_W, capH);
    // bottom column
    const bCapY = g.top + g.gap;
    ctx.drawImage(bi, 0, 0, bi.width, capSrcB, g.x, bCapY, GATE_W, capH);
    const bShaftH = GROUND_Y + 30 - (bCapY + capH);
    if (bShaftH > 0)
      ctx.drawImage(bi, 0, capSrcB, bi.width, bi.height - capSrcB, g.x, bCapY + capH, GATE_W, bShaftH);
  }

  function drawCat() {
    const frames = [img.up, img.mid, img.down];
    let sprite;
    if (state === 'dying' || state === 'over') sprite = img.hurt;
    else if (state === 'ready' && blinkT < 0.16) sprite = img.blink;
    else sprite = frames[Math.floor(cat.wing) % 3];
    ctx.save();
    ctx.translate(cat.x + CAT_W / 2, cat.y + CAT_H / 2);
    ctx.rotate(cat.rot);
    ctx.drawImage(sprite, -CAT_W / 2, -CAT_H / 2, CAT_W, CAT_H);
    ctx.restore();
  }

  function drawScore() {
    if (state !== 'play' && state !== 'dying') return;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 62px "Baloo 2","Trebuchet MS",sans-serif';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 11; ctx.strokeStyle = '#5E3320';
    ctx.strokeText(score, W / 2, 92);
    ctx.fillStyle = '#FCE7CD'; ctx.fillText(score, W / 2, 92);
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

    ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, H + 40);

    for (const s of stars) {
      const tw = reduce ? 0.7 : 0.45 + 0.55 * Math.abs(Math.sin(t * s.s + s.p));
      ctx.globalAlpha = tw * 0.9 * Math.max(0, 1 - s.y / 460);
      ctx.fillStyle = '#FFF6E2';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const c of clouds) {
      const im = c.k ? img.cloud1 : img.cloud0;
      ctx.globalAlpha = 0.34 + c.d * 0.9;
      ctx.drawImage(im, c.x, c.y, 190 * c.s, 96 * c.s);
    }
    ctx.globalAlpha = 1;

    for (const g of gates) drawGate(g);

    for (const p of parts) {
      const k = 1 - p.life / p.max;
      ctx.save();
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const s = p.size * (p.k === 's' ? 0.5 + k * 0.8 : 1);
      ctx.drawImage(p.k === 'f' ? img.feather : img.sparkle, -s / 2, -s / 2, s, s);
      ctx.restore();
    }

    drawCat();

    // cloud floor
    const off = state === 'over' ? 0 : (t * (state === 'play' ? speed : 26)) % 400;
    for (let x = -off; x < W + 400; x += 400)
      ctx.drawImage(img.ground, x, GROUND_Y - 26, 400, GROUND_H + 26);

    drawScore();
    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = `rgba(255,246,226,${flash * 0.55})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* -------------------------------------------------------- main loop */
  function resize() {
    const r = frame.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    document.documentElement.style.setProperty('--u', (r.width / W).toFixed(4));
    makeSky();
  }
  addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(frame);

  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    acc += dt;
    while (acc > 1 / 120) { step(1 / 120); acc -= 1 / 120; }
    render();
    requestAnimationFrame(loop);
  }

  Promise.all(pending).then(() => {
    resize();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
